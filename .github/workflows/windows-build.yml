name: Build COA + Playerbots Windows
on:
  workflow_dispatch:

env:
  BOOST_ROOT: C:\local\boost_1_82_0
  MSYS_NO_PATHCONV: 1

jobs:
  build:
    runs-on: windows-2022
    steps:
      # 拉取 COA 核心到仓库根目录
      - name: Checkout azerothcore-wotlk-coa
        uses: actions/checkout@v4
        with:
          repository: as2860-AI/azerothcore-wotlk-coa
          ref: master

      # 拉取 playerbots 模块，放入 coa 的 modules/mod-playerbots
      - name: Checkout mod-playerbots into modules
        uses: actions/checkout@v4
        with:
          repository: as2860-AI/mod-playerbots
          ref: master
          path: ./modules/mod-playerbots

      # 安装Boost
      - name: Setup Boost 1.82.0
        uses: ilammy/setup-boost@v1
        with:
          version: 1.82.0

      # 安装AC依赖
      - name: Install dependencies
        shell: bash
        run: |
          chmod +x acore.sh
          ./acore.sh install-deps

      # CMake配置 + 编译
      - name: Configure and Build
        shell: bash
        run: |
          ./acore.sh compiler configure
          ./acore.sh compiler build

      # 上传编译产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: COA-Playerbots-Win
          path: ./env/dist/bin/
          retention-days: 7
