name: windows-build
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    name: Windows-最新
    env:
      BOOST_ROOT: C:\Libraries\boost_1_84_0
      BOOST_LIBRARYDIR: C:\Libraries\boost_1_84_0\lib64-msvc-14.3
    steps:
      - name: 运行动作/checkout@v4
        uses: actions/checkout@v4

      - name: Clone my forked mod-playerbots
        shell: bash
        run: |
          mkdir -p modules
          for i in {1..3}; do
            git clone --branch coa https://github.com/as2860-AI/mod-playerbots.git modules/mod-playerbots && break
            echo "Clone attempt $i failed, retry after 10s"
            sleep 10
          done

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-${{ github.sha }}

      - name: 缓存提升与MySQL
        uses: actions/cache@v4
        with:
          path: |
            C:\Libraries\boost_1_84_0
            C:\ProgramData\MySQL
          key: win-coa-boost-mysql-v1

      - name: 配置操作系统
        shell: pwsh
        run: |
          choco install mysql --version=8.0.36 -y
          choco install boost-msvc-14.3 --version=1.84.0 -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y
          choco install git -y

      - name: 建造
        shell: bash
        run: |
          # 进入acore源码根目录（关键修复！）
          cd $GITHUB_WORKSPACE
          export CTOOLS_BUILD=all
          export CCUSTOMOPTIONS="-DMYSQL_INCLUDE_DIR=C:/ProgramData/MySQL/MySQLServer8.0/include -DMYSQL_LIBRARY=C:/ProgramData/MySQL/MySQLServer8.0/lib/libmysql.lib"
          export CCUSTOMOPTIONS+=" -DBOOST_ROOT=${BOOST_ROOT} -DBOOST_LIBRARYDIR=${BOOST_LIBRARYDIR}"
          ./acore.sh compiler build

      - name: 安装 (显式)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          ./acore.sh compiler install

      - name: 列表已安装文件
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          ls -la bin/Release/

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: coa-server-bin
          path: bin/Release/
          retention-days: 14
